<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 824" width="760" height="824" role="img" aria-label="Each turn is read, settled on the grid, told, then filed back"><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.bg{fill:#ffffff}
.title{font-size:15px;font-weight:600;fill:#1f2328}
.name{font-weight:600;fill:#1f2328}
.plain{fill:#1f2328}
.body,.note{font-size:11.5px;fill:#59636e}
.box{fill:none;stroke:#8c959f;stroke-width:1.25}
.main{fill:rgba(9,105,218,0.12);stroke:#0969da;stroke-width:2}
.edge{fill:none;stroke:#8c959f;stroke-width:1.25}
#a path{fill:#8c959f}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.title,.name,.plain{fill:#e6edf3}
.body,.note{fill:#9198a1}
.box,.edge{stroke:#6e7681}
#a path{fill:#6e7681}
.main{fill:rgba(68,147,248,0.15);stroke:#4493f8}
}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="760" height="824" rx="12"/><text x="24" y="34" class="title">Each turn is read, settled on the grid, told, then filed back</text><path d="M190 116V144" class="edge" marker-end="url(#a)"/><path d="M190 216V244" class="edge" marker-end="url(#a)"/><path d="M190 316V344" class="edge" marker-end="url(#a)"/><path d="M310 280H410" class="edge" marker-end="url(#a)"/><path d="M560 348V380H340" class="edge" marker-end="url(#a)"/><path d="M190 416V444" class="edge" marker-end="url(#a)"/><path d="M190 516V544" class="edge" marker-end="url(#a)"/><path d="M190 616V644" class="edge" marker-end="url(#a)"/><path d="M190 716V744" class="edge" marker-end="url(#a)"/><path d="M340 680H410" class="edge" marker-end="url(#a)"/><path d="M710 680H736V88H340" class="edge" marker-end="url(#a)"/><rect x="40" y="60" width="300" height="56" rx="8" class="box"/><text x="56" y="84" class="name">1. You speak</text><text x="56" y="100" class="body">typed, or said aloud hands-free</text><rect x="40" y="144" width="300" height="72" rx="8" class="box"/><text x="56" y="168" class="name">2. Look</text><text x="56" y="184" class="body">one form: who you turn to, where you go,</text><text x="56" y="200" class="body">what to look up, what happens next</text><polygon points="70,280 190,244 310,280 190,316" class="box"/><text x="190" y="284" class="plain" text-anchor="middle">New place with no map?</text><rect x="40" y="344" width="300" height="72" rx="8" class="box"/><text x="56" y="368" class="name">3. Settle on the grid</text><text x="56" y="384" class="body">code moves you, seats you, puts what you</text><text x="56" y="400" class="body">take in your hands; lookups answered</text><rect x="40" y="444" width="300" height="72" rx="8" class="box"/><text x="56" y="468" class="name">4. What matters</text><text x="56" y="484" class="body">a yes/no pass picks the card items this</text><text x="56" y="500" class="body">moment needs; skipped on a quiet talk</text><rect x="40" y="544" width="300" height="72" rx="8" class="box"/><text x="56" y="568" class="name">5. Plan the moment</text><text x="56" y="584" class="body">you walk over if you said so; the person</text><text x="56" y="600" class="body">you face engages, moves or reaches</text><rect x="40" y="644" width="300" height="72" rx="8" class="main"/><text x="56" y="668" class="name">6. Tell it</text><text x="56" y="684" class="body">the room in plain words goes to the</text><text x="56" y="700" class="body">storyteller; code checks the reply</text><rect x="40" y="744" width="300" height="56" rx="8" class="box"/><text x="56" y="768" class="name">7. Read aloud</text><text x="56" y="784" class="body">the reply is spoken to you</text><rect x="410" y="212" width="300" height="136" rx="8" class="box"/><text x="426" y="236" class="name">Room builder (first visit only)</text><text x="426" y="252" class="body">shell: type, size, doors, windows</text><text x="426" y="268" class="body">things: one batch, each sorted and sized</text><text x="426" y="284" class="body">places: zones checked against the rules;</text><text x="426" y="300" class="body">refused ones asked again, all at once</text><text x="426" y="316" class="body">people one by one: seat, things, needs</text><text x="426" y="332" class="body">you (opening): where the story puts you</text><rect x="410" y="628" width="300" height="104" rx="8" class="box"/><text x="426" y="652" class="name">Rebuild, while it is read aloud</text><text x="426" y="668" class="body">quiet talk turn: one state-diff call</text><text x="426" y="684" class="body">otherwise short questions: where you are,</text><text x="426" y="700" class="body">the time, who is with you, anyone new,</text><text x="426" y="716" class="body">everyone now, what you have, what is around</text><text x="360" y="272" class="note" text-anchor="middle">yes</text><text x="200" y="334" class="note">no</text><text x="570" y="368" class="note">then</text><text x="375" y="672" class="note" text-anchor="middle">meanwhile</text><text x="560" y="80" class="note" text-anchor="middle">next turn</text></svg>